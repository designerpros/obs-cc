# Kubernetes Secrets (TEMPLATE - fill with actual values)
# Create actual secrets using: kubectl create secret generic ... --from-literal=...

---
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-secrets
  namespace: stream-pipeline
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "CHANGEME"

  # Redis
  REDIS_PASSWORD: "CHANGEME"

  # LLM APIs
  ANTHROPIC_API_KEY: "sk-ant-CHANGEME"
  OPENAI_API_KEY: "sk-CHANGEME"
  GROK_API_KEY: "xai-CHANGEME"
  PERPLEXITY_API_KEY: "pplx-CHANGEME"

  # AssemblyAI
  ASSEMBLYAI_API_KEY: "CHANGEME"

  # Hugging Face (for Pyannote)
  HF_TOKEN: "hf_CHANGEME"

  # LATE API
  LATE_API_KEY: "CHANGEME"
  LATE_API_ENDPOINT: "https://api.late.dev"

  # S3
  S3_ENDPOINT: "s3.amazonaws.com"
  S3_ACCESS_KEY: "CHANGEME"
  S3_SECRET_KEY: "CHANGEME"

  # Webhook
  WEBHOOK_AUTH_TOKEN: "CHANGEME"

  # Telegram
  TELEGRAM_BOT_TOKEN: "CHANGEME"
  TELEGRAM_CHAT_ID: "CHANGEME"

  # Discord
  DISCORD_WEBHOOK_URL: "CHANGEME"

---
# Note: To create this secret from command line:
# kubectl create secret generic pipeline-secrets \
#   --namespace=stream-pipeline \
#   --from-literal=POSTGRES_PASSWORD="your_password" \
#   --from-literal=ANTHROPIC_API_KEY="sk-ant-..." \
#   ... (and so on for all keys)
