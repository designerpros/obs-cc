# Analysis Worker
# LLM-based topic scoring, metadata generation, and virality analysis

---
# Analysis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis
  namespace: stream-pipeline
  labels:
    app: analysis
    component: worker
spec:
  replicas: 3  # 3 analysis workers for parallel processing
  selector:
    matchLabels:
      app: analysis
  template:
    metadata:
      labels:
        app: analysis
        component: worker
    spec:
      containers:
      - name: analysis
        image: stream-pipeline-analysis:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
          name: metrics
        env:
        # Database
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "stream_extraction"
        - name: POSTGRES_USER
          value: "pipeline_worker"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: POSTGRES_PASSWORD

        # Redis
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: REDIS_PASSWORD

        # LLM API Keys
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: ANTHROPIC_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: OPENAI_API_KEY
        - name: GROK_API_KEY
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: GROK_API_KEY
              optional: true
        - name: PERPLEXITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: PERPLEXITY_API_KEY
              optional: true

        # Service configuration
        - name: SERVICE_NAME
          value: "analysis"
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYTHONUNBUFFERED
          value: "1"

        volumeMounts:
        - name: work
          mountPath: /mnt/pipeline/work
        - name: config
          mountPath: /app/config
          readOnly: true

        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"

        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10

        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 9092
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10

      volumes:
      - name: work
        persistentVolumeClaim:
          claimName: pipeline-work-pvc
      - name: config
        hostPath:
          path: /mnt/pipeline/config
          type: Directory

---
# Analysis Service (for metrics)
apiVersion: v1
kind: Service
metadata:
  name: analysis
  namespace: stream-pipeline
  labels:
    app: analysis
    component: worker
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: metrics
  selector:
    app: analysis
