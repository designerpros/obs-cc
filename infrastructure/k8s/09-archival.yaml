# Archival Worker
# S3 uploads with tiered storage (Deep Glacier for sources, Glacier for extractions)

---
# Archival Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archival
  namespace: stream-pipeline
  labels:
    app: archival
    component: worker
spec:
  replicas: 2  # 2 archival workers for parallel uploads
  selector:
    matchLabels:
      app: archival
  template:
    metadata:
      labels:
        app: archival
        component: worker
    spec:
      containers:
      - name: archival
        image: stream-pipeline-archival:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9095
          name: metrics
        env:
        # Database
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "stream_extraction"
        - name: POSTGRES_USER
          value: "pipeline_worker"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: POSTGRES_PASSWORD

        # Redis
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: REDIS_PASSWORD

        # AWS S3 Configuration
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: pipeline-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: S3_BUCKET
          value: "bbb-pipeline-recordings"
        - name: S3_BUCKET_EXTRACTIONS
          value: "bbb-pipeline-extractions"

        # Service configuration
        - name: SERVICE_NAME
          value: "archival"
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYTHONUNBUFFERED
          value: "1"

        volumeMounts:
        - name: work
          mountPath: /mnt/pipeline/work
        - name: config
          mountPath: /app/config
          readOnly: true

        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"

        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 9095
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10

        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 9095
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10

      volumes:
      - name: work
        persistentVolumeClaim:
          claimName: pipeline-work-pvc
      - name: config
        hostPath:
          path: /mnt/pipeline/config
          type: Directory

---
# Archival Service (for metrics)
apiVersion: v1
kind: Service
metadata:
  name: archival
  namespace: stream-pipeline
  labels:
    app: archival
    component: worker
spec:
  type: ClusterIP
  ports:
  - port: 9095
    targetPort: 9095
    protocol: TCP
    name: metrics
  selector:
    app: archival
